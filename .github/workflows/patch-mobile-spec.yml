name: Patch mobile SPEC once

on:
  push:
    branches:
      - fix/download-print-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/download-print-contract

      - name: Patch SPEC
        run: python3 scripts/patch-mobile-spec.py

      - name: Commit SPEC if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SPEC.md; then
            echo "SPEC already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md
          git commit -m "docs: define mobile download and print contract"
          git push origin HEAD:fix/download-print-contract
