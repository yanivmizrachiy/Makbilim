name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: makbilim-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Validate and build workbook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync pinned curriculum source
        run: npm run sync:curriculum

      - name: Validate canonical contracts and content
        run: npm run validate

      - name: Ensure generated curriculum has eight immutable blocks
        run: |
          node -e "const fs=require('fs');const p='src/content/generated/curriculum-source.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.blockCount!==8||j.immutable!==true)process.exit(1);console.log('generated curriculum PASS')"

      - name: Install Chromium for print QA
        run: npx playwright install --with-deps chromium

      - name: Build PDF and visual QA
        timeout-minutes: 10
        run: npm run pdf

      - name: Upload workbook artifacts
        uses: actions/upload-artifact@v7
        with:
          name: makbilim-workbook-${{ github.sha }}
          path: |
            artifacts/pdf/*.pdf
            artifacts/screenshots/*.png
            artifacts/layout-report.json
            artifacts/pdf-crosscheck.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated preview for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    name: Deploy validated workbook preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
