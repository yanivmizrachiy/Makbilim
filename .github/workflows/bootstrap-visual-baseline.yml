name: Bootstrap visual baseline

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: makbilim-bootstrap-visual-baseline
  cancel-in-progress: true

jobs:
  baseline:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare canonical content
        run: |
          npm run sync:curriculum
          npm run validate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render validated workbook
        run: npm run pdf

      - name: Commit canonical visual baseline
        run: |
          mkdir -p qa
          cp artifacts/layout-report.json qa/visual-baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/visual-baseline.json
          if git diff --cached --quiet; then
            echo "visual baseline already current"
            exit 0
          fi
          git commit -m "qa: add canonical visual baseline"
          git push origin HEAD:main
