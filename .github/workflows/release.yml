name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: makbilim-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.2'
  PYTHON_VERSION: '3.14.7'

jobs:
  release:
    name: Build verified release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches package version
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || { echo "Tag $GITHUB_REF_NAME must equal package version $EXPECTED"; exit 1; }

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Sync and validate canonical content
        run: |
          npm run sync:curriculum
          npm run validate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build all verified PDFs
        run: npm run pdf

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             artifacts/pdf/*.pdf             artifacts/SHA256SUMS.txt             artifacts/build-manifest.json             artifacts/pdf-crosscheck.json             artifacts/teacher-pdf-report.json             artifacts/accessibility-report.json             artifacts/sbom.cdx.json             artifacts/input-fingerprint.json             sources/manifest.json             --verify-tag             --generate-notes             --title "Makbilim ${GITHUB_REF_NAME}"
