name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: makbilim-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Build verified release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync and validate canonical content
        run: |
          npm run sync:curriculum
          npm run validate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build all verified PDFs
        run: npm run pdf

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             artifacts/pdf/*.pdf             artifacts/SHA256SUMS.txt             artifacts/build-manifest.json             artifacts/pdf-crosscheck.json             artifacts/teacher-pdf-report.json             --verify-tag             --generate-notes             --title "Makbilim ${GITHUB_REF_NAME}"
